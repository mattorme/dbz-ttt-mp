<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multiplayer Tic Tac Toe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <h1>Multiplayer Tic Tac Toe</h1>

    <section id="lobbyScreen" class="panel">
      <p id="lobbyStatus">Loading available lobbies…</p>
      <div class="lobby-controls">
        <button id="createLobbyButton" type="button">Create Lobby</button>
      </div>
      <ul id="lobbyList" class="lobby-list" aria-label="Lobby list"></ul>
    </section>

    <section id="gameScreen" class="panel hidden">
      <div class="status-panel">
        <div>
          <p id="gameInfo">Waiting for game...</p>
          <p id="statusText">...</p>
        </div>
        <button id="leaveGameButton" type="button">Leave Game</button>
      </div>
      <div id="characterModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Character selector">
        <section id="characterSelector" class="character-selector">
          <p id="characterSelectorText">Select your fighter to start.</p>
          <div id="characterOptions" class="character-options"></div>
        </section>
      </div>
      <section class="board" id="board" aria-label="Tic Tac Toe board">
        <button class="cell" data-index="0" aria-label="Cell 1"></button>
        <button class="cell" data-index="1" aria-label="Cell 2"></button>
        <button class="cell" data-index="2" aria-label="Cell 3"></button>
        <button class="cell" data-index="3" aria-label="Cell 4"></button>
        <button class="cell" data-index="4" aria-label="Cell 5"></button>
        <button class="cell" data-index="5" aria-label="Cell 6"></button>
        <button class="cell" data-index="6" aria-label="Cell 7"></button>
        <button class="cell" data-index="7" aria-label="Cell 8"></button>
        <button class="cell" data-index="8" aria-label="Cell 9"></button>
      </section>
    </section>

    <div id="resultModal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-content">
        <h2>Game Over</h2>
        <p id="modalMessage"></p>
        <button id="returnLobbyButton" type="button">Return to Lobby</button>
      </div>
    </div>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
