<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Hair (spiky) -->
  <path d="M 100 15 L 120 35 L 130 20 L 140 40 L 125 50 L 135 55 L 110 60 L 95 55 L 65 55 L 40 50 L 55 40 L 70 20 L 80 35 Z" fill="#2a2a2a"/>
  
  <!-- Head -->
  <circle cx="100" cy="85" r="35" fill="#d4a574"/>
  
  <!-- Eyes (menacing) -->
  <circle cx="85" cy="75" r="5" fill="#1a1a1a"/>
  <circle cx="115" cy="75" r="5" fill="#1a1a1a"/>
  <circle cx="85" cy="75" r="2" fill="#ffffff"/>
  <circle cx="115" cy="75" r="2" fill="#ffffff"/>
  
  <!-- Mouth (smirk) -->
  <path d="M 85 95 Q 100 105 115 95" stroke="#8b6f47" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Scouter marks -->
  <circle cx="75" cy="70" r="3" fill="#ff6b00"/>
  
  <!-- Gi armor (blue) -->
  <rect x="55" y="125" width="90" height="50" rx="10" fill="#1e40af"/>
  
  <!-- Armor plating -->
  <rect x="60" y="130" width="25" height="35" fill="#c0a080"/>
  <rect x="115" y="130" width="25" height="35" fill="#c0a080"/>
  
  <!-- Center stripe -->
  <rect x="95" y="125" width="10" height="50" fill="#8b6f47"/>
  
  <!-- Arms (muscular) -->
  <rect x="25" y="135" width="30" height="25" rx="12" fill="#1e40af"/>
  <rect x="145" y="135" width="30" height="25" rx="12" fill="#1e40af"/>
  
  <!-- Energy aura (purple) -->
  <circle cx="100" cy="95" r="50" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.5"/>
  <circle cx="100" cy="95" r="55" fill="none" stroke="#d8b4fe" stroke-width="1" opacity="0.3"/>
</svg>